name: Update publications

on:
  schedule:
    - cron: "17 4 * * 1"   # every Monday at 04:17 UTC
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build publication list
        env:
          SCHOLAR_ID: opodZE4AAAAJ
          FILL_DETAILS: "0"   # set to "1" to show full author lists (slower)
        run: python update_publications.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update publication list"
            git push
          fi
